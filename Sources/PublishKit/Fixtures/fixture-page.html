<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>模拟平台发布页（fixture）</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; max-width: 720px; margin: 40px auto; color: #222; }
  label { font-weight: 600; display: block; margin: 16px 0 6px; }
  input[type=text], input[type=file] { padding: 8px; font-size: 14px; }
  #title { width: 420px; }
  #editor { white-space: pre-wrap; width: 460px; min-height: 140px; border: 1px solid #bbb; border-radius: 6px; padding: 10px; background: #fafafa; }
  #publish-btn { margin-top: 20px; padding: 10px 24px; font-size: 15px; background: #d4d4d4; border: none; border-radius: 6px; cursor: pointer; }
  #receipt { display: none; margin-top: 16px; padding: 12px; background: #e8f7ee; border: 1px solid #7ecb9d; border-radius: 6px; }
  .hint { color: #777; font-size: 12px; }
</style>
</head>
<body>
  <h2>模拟平台发布页</h2>
  <p class="hint">此页面由 PublishFlow 提供，用于无登录验证引擎全链路。结构与真实创作平台（标题框/纯文本正文/文件上传）对齐。</p>

  <label>标题</label>
  <input id="title" type="text" placeholder="填写标题（20 字以内）">

  <label>正文（纯文本）</label>
  <textarea id="editor" placeholder="输入纯文本，支持换行和 emoji"></textarea>

  <label>图片上传</label>
  <input id="files" type="file" multiple accept="image/jpeg,image/png,image/webp">


  <button id="publish-btn">确认发布</button>
  <div id="receipt" data-url="">✅ 已发布：<span id="receipt-url"></span></div>

  <script>
    // 记录关键事件，供适配器/人工核对
    window.__events = [];
    const editor = document.getElementById('editor');
    editor.addEventListener('input', () => window.__events.push('editor:input'));
    document.getElementById('files').addEventListener('change', e => {
      window.__events.push('files:' + [...e.target.files].map(f => f.name).join(','));
    });

    document.getElementById('publish-btn').addEventListener('click', () => {
      const url = 'https://sim.example.com/p/' + Math.random().toString(36).slice(2, 8);
      const box = document.getElementById('receipt');
      box.dataset.url = url;
      box.style.display = 'block';
      document.getElementById('receipt-url').textContent = url;
      document.getElementById('publish-btn').disabled = true;
      window.__events.push('published:' + url);
    });
  </script>
</body>
</html>
